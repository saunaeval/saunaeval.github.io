<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>saunaeval - Software Engineer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 40px;
            max-width: 600px;
            text-align: center;
        }
        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .title {
            color: #667eea;
            font-size: 1.1em;
            margin-bottom: 30px;
            font-weight: 500;
        }
        .bio {
            color: #555;
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 40px;
        }
        .links {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .links a {
            display: inline-block;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s ease;
            font-weight: 500;
        }
        .links a:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>saunaeval</h1>
        <div class="title">Software Engineer</div>
        <p class="bio">
            Passionate about web development and open-source technologies. Always learning and exploring new ways to build great digital experiences.
        </p>
        <div class="links">
            <a href="https://github.com/saunaeval" target="_blank">GitHub</a>
            <a href="https://linkedin.com/in/saunaeval" target="_blank">LinkedIn</a>
        </div>
    </div>
</body>
</html>
